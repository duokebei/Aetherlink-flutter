name: Build (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"   # 当前 stable，Dart 3.14.0

jobs:
  android:
    name: Android APK / AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        shell: bash
        run: |
          raw=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '\r')
          if [[ ! "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo "Unexpected pubspec version: '$raw'" >&2
            exit 1
          fi
          echo "name=${raw%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${raw##*+}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Pub get + generated code
        run: |
          flutter pub get
          dart run build_runner build -d

      - name: Build APK
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Collect
        shell: bash
        run: |
          v="${{ steps.version.outputs.name }}+${{ steps.version.outputs.build }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/aetherlink-${v}-universal.apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            f="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [[ -f "$f" ]] && cp "$f" "dist/aetherlink-${v}-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/aetherlink-${v}.aab"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: aetherlink-android-${{ steps.version.outputs.name }}+${{ steps.version.outputs.build }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ($raw -notmatch '^(\d+\.\d+\.\d+)(?:\+(\d+))?$') {
            throw "Unexpected pubspec version: '$raw'"
          }
          $v = $Matches[1] + '+' + $Matches[2]
          Add-Content -Path $env:GITHUB_OUTPUT -Value "full=$v"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get + generated code
        run: |
          flutter pub get
          dart run build_runner build -d

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.full }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/aetherlink-windows-x64-$v.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: aetherlink-windows-${{ steps.version.outputs.full }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        shell: bash
        run: |
          raw=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '\r')
          echo "full=${raw}" >> "$GITHUB_OUTPUT"

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get + generated code
        run: |
          flutter pub get
          dart run build_runner build -d

      - name: Build Linux
        run: flutter build linux --release

      - name: Package
        shell: bash
        run: |
          v="${{ steps.version.outputs.full }}"
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf \
            "dist/aetherlink-linux-x64-${v}.tar.gz" .
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: aetherlink-linux-${{ steps.version.outputs.full }}
          path: dist/*
          if-no-files-found: error
